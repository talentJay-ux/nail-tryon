<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>美甲试色镜</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: one screen — the photo fills it, a translucent sheet with tabbed controls floats over the bottom */
:root{
  --bg:#120D14; --ink:#F6F0F5; --muted:#B9ADBC; --line:rgba(255,255,255,.14);
  --sheet:rgba(24,16,24,.72); --chipline:rgba(255,255,255,.18);
  --accent:#E3689C; --accent-soft:rgba(227,104,156,.22); --on-accent:#1B1016;
  --font-body:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.4;overflow:hidden;-webkit-user-select:none;user-select:none}
.app{position:relative;height:100%;overflow:hidden}
.stage{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:calc(56px + env(safe-area-inset-top,0px));box-sizing:border-box;touch-action:none}
@media (min-width:900px){.stage{align-items:center;padding-top:0}}
.stage canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;cursor:grab}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;color:#F2EDF4;background:linear-gradient(160deg,#2A1A24,#140F17);z-index:3}
.overlay p{margin:0;max-width:26em;color:#CFC3D2}
.overlay .big{font-size:20px;font-weight:700;color:#fff}
.top{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.top>*{pointer-events:auto}
.pill{font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(20,12,18,.65);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill.warn{background:rgba(164,46,99,.85)}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);background:rgba(20,12,18,.65);color:#fff;font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer;position:relative;overflow:hidden;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ibtn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.ibtn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.ibtn[disabled]{opacity:.45;cursor:default}
/* bottom sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--sheet);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;max-height:46%}
.sheet.min{max-height:none}
.sheet.min .body,.sheet.min .who{display:none}
.tabs{display:flex;align-items:center;gap:4px;padding-top:8px}
.tabs button{flex:1 1 auto;padding:7px 4px;border-radius:999px;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.tabs button[aria-selected="true"]{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.tabs .fold{flex:0 0 auto;width:34px;color:var(--muted);font-size:16px}
.who{display:flex;gap:4px;align-items:center}
.who button{flex:1 1 0;padding:5px 0;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:inherit;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.who button i{display:block;width:11px;height:11px;border-radius:50%;border:1px solid var(--chipline)}
.who button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.body{min-height:0;overflow:hidden;padding-bottom:10px}
.pane{display:none}.pane.on{display:block}
/* colour card: one horizontal strip, two rows, grouped by family */
.strip{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 6px;scrollbar-width:thin}
.fam{flex:none;display:flex;flex-direction:column;gap:4px}
.fam h3{margin:0;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.chips{display:grid;grid-template-rows:repeat(2,1fr);grid-auto-flow:column;gap:4px}
.chip{position:relative;width:40px;height:40px;border-radius:9px;border:1px solid var(--chipline);cursor:pointer;padding:0;background:none}
.chip::after{content:attr(data-code);position:absolute;left:0;right:0;bottom:1px;font-size:9px;text-align:center;color:rgba(255,255,255,.92);text-shadow:0 0 2px rgba(0,0,0,.7)}
.chip[aria-pressed="true"]{outline:2px solid #fff;outline-offset:1px}
.now{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.now .big{width:30px;height:30px;border-radius:8px;border:1px solid var(--chipline);flex:none}
.now b{font-size:14px}.now small{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:8px}
.sliders{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:13px;padding-top:4px}
.sliders output{font-variant-numeric:tabular-nums;color:var(--muted);min-width:3.2em;text-align:right}
input[type=range]{width:100%;accent-color:var(--accent);margin:0;height:28px}
#hue{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);height:8px;border-radius:4px;-webkit-appearance:none;appearance:none}
#hue::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;padding:7px 8px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.lbl{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin:8px 0 4px}
.lbl:first-child{margin-top:0}
.posrow{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:6px}
.tip{margin:0;font-size:12px;color:var(--muted)}
.pats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.pat{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 6px 5px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);font:inherit;font-size:11px;cursor:pointer}
.pat canvas{display:block;width:34px;height:46px;border-radius:6px}
.pat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:#fff;font-weight:600}
#sheetText{width:100%;max-width:520px;box-sizing:border-box;height:110px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.06);color:var(--ink);font:inherit;font-size:12px;padding:8px;resize:none}
.modal img{max-height:55%}
/* saved image */
.modal{position:absolute;inset:0;z-index:6;background:rgba(10,6,10,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.modal img{max-width:100%;max-height:80%;border-radius:12px}
button:focus-visible,.ibtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}}
@media (min-width:900px){.sheet{left:auto;right:16px;bottom:16px;width:400px;max-height:calc(100% - 90px);border-radius:18px;border:1px solid var(--line)}}
</style>

</head>
<body>
<div class="app">
  <div class="stage" id="viewer"><canvas id="cv" width="720" height="960"></canvas></div>
  <div class="overlay" id="overlay">
    <div class="spin" id="spin"></div>
    <p class="big" id="ovTitle">正在加载手部识别模型</p>
    <p id="ovText">第一次打开要下载约 10 MB，之后会快很多。</p>
  </div>
  <div class="top">
    <span class="pill" id="stHands">还没有照片</span>
    <span style="display:flex;gap:6px">
      <button class="ibtn" id="snapBtn" disabled>保存</button>
      <label class="ibtn primary">拍照 / 选图<input type="file" id="file" accept="image/*"></label>
    </span>
  </div>

  <section class="sheet" id="sheet" aria-label="调整">
    <div class="tabs" role="tablist">
      <button role="tab" data-t="card" aria-selected="true">色号</button>
      <button role="tab" data-t="tune" aria-selected="false">调色</button>
      <button role="tab" data-t="pat" aria-selected="false">图案</button>
      <button role="tab" data-t="fin" aria-selected="false">质感</button>
      <button role="tab" data-t="pos" aria-selected="false">位置</button>
      <button class="fold" id="foldBtn" aria-label="收起">︾</button>
    </div>
    <div class="who" id="fingerSel"></div>
    <div class="body">
      <div class="pane on" id="pane-card">
        <div class="now"><span class="big" id="nowDot"></span><b id="nowCode">R03</b><small id="nowHex">#C41E30</small><small id="stSel"></small>
          <span class="seg" id="layerSeg" style="margin-left:auto"><button data-k="base" aria-pressed="true">底色</button><button data-k="pc" aria-pressed="false">图案色</button></span></div>
        <div class="strip" id="card"></div>
      </div>
      <div class="pane" id="pane-tune">
        <div class="sliders">
          <span>色相</span><input type="range" id="hue" min="0" max="360" value="0"><output id="hueOut">0°</output>
          <span>饱和</span><input type="range" id="sat" min="0" max="100" value="0"><output id="satOut">0%</output>
          <span>明度</span><input type="range" id="lig" min="0" max="100" value="0"><output id="ligOut">0%</output>
          <span>遮盖</span><input type="range" id="opacity" min="40" max="100" value="100"><output id="opOut">100%</output>
        </div>
      </div>
      <div class="pane" id="pane-pat">
        <div class="pats" id="patGrid"></div>
        <p class="lbl">点缀</p><div class="seg" id="decSeg"></div>
      </div>
      <div class="pane" id="pane-fin">
        <p class="lbl">质感</p><div class="seg" id="finSeg"></div>
        <p class="lbl">甲型</p><div class="seg" id="shapeSeg"></div>
        <p class="lbl">长度</p><div class="seg" id="lenSeg"></div>
      </div>
      <div class="pane" id="pane-pos">
        <div class="sliders">
          <span>宽窄</span><input type="range" id="adjW" min="60" max="160" value="100"><output id="adjWOut">100%</output>
          <span>长短</span><input type="range" id="adjL" min="60" max="180" value="100"><output id="adjLOut">100%</output>
          <span>角度</span><input type="range" id="adjR" min="-90" max="90" value="0"><output id="adjROut">0°</output>
        </div>
        <div class="posrow"><p class="tip">在图上点一片指甲选中，按住拖动挪位置。</p><button class="ibtn" id="resetBtn" disabled>恢复自动</button></div>
        <p class="lbl">关键点参数（全部指甲）</p>
        <div class="sliders">
          <span>前伸</span><input type="range" id="calFwd" min="0" max="80" value="32"><output id="calFwdOut">0.32</output>
          <span>后缩</span><input type="range" id="calBack" min="0" max="80" value="32"><output id="calBackOut">0.32</output>
        </div>
        <div class="posrow"><label class="tip" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="showPts">显示关键点</label><button class="ibtn" id="calReset">参数恢复默认</button></div>
        <p class="tip">单位是末节指骨长度的倍数。宽度自动从照片里量手指粗细得出，用上面"宽窄"微调。</p>
      </div>
    </div>
  </section>

  <div class="modal" id="shot" hidden>
    <img id="shotImg" alt="试色效果图">
    <textarea id="sheetText" readonly aria-label="设计单文字"></textarea>
    <div style="display:flex;gap:8px"><button class="ibtn" id="copyBtn">复制设计单</button><button class="ibtn" id="shotClose">关闭</button></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
/* ---------- colour card: salon-style numbered shades ---------- */
const FAMS=[
 ['N','裸色',['#F3E4DA','#EED3C6','#E8C4B4','#E1B5A3','#D9A894','#CE9A86','#C58B78','#B87A68']],
 ['P','粉色',['#F9D9E0','#F6C3D0','#F2A9BE','#EE8FAC','#E87197','#E05585','#D43C72','#C42A62']],
 ['R','红色',['#E9414E','#D92B3A','#C41E30','#B01426','#9A1222','#82101D','#6B1A2B','#531119']],
 ['O','珊瑚橘',['#F7B49A','#F49C7C','#EF8565','#E96E4F','#E0573C','#D1452E','#C0392B','#A53125']],
 ['B','豆沙莓果',['#D9A0A0','#CC8A8C','#BE7678','#B5787A','#A6666A','#945A5E','#7E4A4F','#683C42']],
 ['V','紫色',['#E4D5EC','#D1BCE0','#B4A0CD','#9F86BD','#8A6EAB','#765797','#5F4480','#49336A']],
 ['U','蓝色',['#D6E2EE','#B9CCE0','#8DA5C1','#6F8FB0','#55789D','#3F6188','#2E4B6E','#1F3451']],
 ['G','绿色',['#DCE6D2','#C3D4B3','#9AB287','#7F9C6D','#668557','#4F6E45','#3B5736','#2A4128']],
 ['C','焦糖棕',['#E8D3BE','#D9BC9E','#C8A586','#B68E6E','#A3622E','#8C5A3C','#6E4630','#4F3222']],
 ['K','灰黑白',['#FFFFFF','#F0ECEA','#D8D3D1','#B5AFAD','#8E8886','#605B5A','#3B3738','#1D191C']],
 ['M','金属',['#E2CFA2','#D2AC3C','#C98B7A','#BFC3C9','#9C6B3E','#6F7378','#8A7F6B','#4A4F57']],
];
const CODES=new Map();FAMS.forEach(([p,_,hs])=>hs.forEach((h,i)=>CODES.set(h.toUpperCase(),p+String(i+1).padStart(2,'0'))));
const FINISHES=[['gloss','亮面'],['matte','哑光'],['jelly','果冻'],['chrome','镜面'],['cateye','猫眼'],['glitter','闪粉'],['aurora','极光']];
const PATTERNS=[['none','纯色'],['french','法式'],['vfrench','V法式'],['gradient','渐变'],['moon','月牙'],['half','斜切'],['dots','波点'],['stripes','条纹'],['check','格纹'],['heart','爱心'],['star','星星'],['flower','小花'],['marble','大理石'],['tipglitter','指尖闪']];
const DECORS=[['none','无'],['gem','水钻'],['pearl','珍珠'],['gems3','三颗钻'],['chain','金链']];
const LENGTHS=[['short','自然'],['medium','中长'],['long','加长']];
const SHAPES=[['round','圆形'],['square','方形'],['almond','杏仁形'],['coffin','芭蕾形']];
const FNAMES=['拇指','食指','中指','无名指','小指'];
const TIP=[4,8,12,16,20], DIP=[3,7,11,15,19], PIP=[2,6,10,14,18];

const CAL0={fwd:.32,back:.32,w:.70,t:.78};
const st={scope:'all',finger:1,shape:'round',len:'short',layer:'base',opacity:1,cal:{...CAL0},showPts:false,per:Array.from({length:5},()=>({color:'#C41E30',pc:'#FFFFFF',finish:'gloss',pattern:'none',decor:'none'}))};
try{Object.assign(st,JSON.parse(localStorage.getItem('nail-tryon-v3')||'{}'));st.cal={...CAL0,...(st.cal||{})};st.per.forEach(p=>{p.pc??='#FFFFFF';p.pattern??='none';p.decor??='none'})}catch(e){}
const save=()=>{try{localStorage.setItem('nail-tryon-v3',JSON.stringify(st))}catch(e){}};
const targets=()=>st.scope==='all'?[0,1,2,3,4]:[st.finger];
const cur=()=>st.per[st.scope==='all'?1:st.finger];
const curColor=()=>st.layer==='pc'?cur().pc:cur().color;
const ck=()=>st.layer==='pc'?'pc':'color';

/* colour maths */
function hexToHsl(h){const n=parseInt(h.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let H=0,S=0;if(mx!==mn){const d=mx-mn;S=l>.5?d/(2-mx-mn):d/(mx+mn);H=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;H*=60}return[Math.round(H),Math.round(S*100),Math.round(l*100)]}
function hslToHex(H,S,L){S/=100;L/=100;const k=n=>(n+H/30)%12,a=S*Math.min(L,1-L),f=n=>L-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return'#'+[f(0),f(8),f(4)].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('').toUpperCase()}
const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
const codeOf=h=>CODES.get(h.toUpperCase())||'自调';

/* ---------- UI (built once; updates touch only what changed) ---------- */
const segHTML=(list,c)=>list.map(([k,v])=>`<button data-k="${k}" aria-pressed="${k===c}">${v}</button>`).join('');
function buildStatic(){
  $('card').innerHTML=FAMS.map(([p,name,hs])=>`<div class="fam"><h3>${p} · ${name}</h3><div class="chips">${hs.map((h,i)=>`<button class="chip" data-c="${h}" data-code="${p}${String(i+1).padStart(2,'0')}" style="background:${h}" aria-pressed="false" aria-label="${p}${String(i+1).padStart(2,'0')}"></button>`).join('')}</div></div>`).join('');
  $('fingerSel').innerHTML=`<button data-i="all" aria-pressed="${st.scope==='all'}">全部</button>`+FNAMES.map((n,i)=>`<button data-i="${i}" aria-pressed="${st.scope==='one'&&i===st.finger}"><i></i>${n}</button>`).join('');
  $('finSeg').innerHTML=segHTML(FINISHES,cur().finish);
  $('shapeSeg').innerHTML=segHTML(SHAPES,st.shape);
  $('lenSeg').innerHTML=segHTML(LENGTHS,st.len);
  $('decSeg').innerHTML=segHTML(DECORS,cur().decor);
  $('patGrid').innerHTML=PATTERNS.map(([k,v])=>`<button class="pat" data-k="${k}" aria-pressed="${k===cur().pattern}"><canvas width="68" height="92"></canvas>${v}</button>`).join('');
}
const press=(root,attr,val)=>root.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset[attr]===String(val))));
function syncUI(){
  const c=curColor(),[H,S,L]=hexToHsl(c);
  press($('fingerSel'),'i',st.scope==='all'?'all':st.finger);
  $('fingerSel').querySelectorAll('i').forEach((el,i)=>el.style.background=st.per[i].color);
  $('card').querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.c.toUpperCase()===c.toUpperCase())));
  $('nowDot').style.background=c;$('nowCode').textContent=codeOf(c);$('nowHex').textContent=c;
  $('hue').value=H;$('hueOut').value=H+'°';$('sat').value=S;$('satOut').value=S+'%';$('lig').value=L;$('ligOut').value=L+'%';
  press($('finSeg'),'k',cur().finish);press($('shapeSeg'),'k',st.shape);press($('lenSeg'),'k',st.len);press($('decSeg'),'k',cur().decor);press($('layerSeg'),'k',st.layer);
  press($('patGrid'),'k',cur().pattern);drawPatThumbs();
  $('opacity').value=Math.round(st.opacity*100);$('opOut').value=Math.round(st.opacity*100)+'%';
  const a=adjOf();$('adjW').value=a.w*100;$('adjWOut').value=Math.round(a.w*100)+'%';$('adjL').value=a.l*100;$('adjLOut').value=Math.round(a.l*100)+'%';$('adjR').value=a.r;$('adjROut').value=a.r+'°';
  const cl=st.cal;$('calFwd').value=cl.fwd*100;$('calFwdOut').value=cl.fwd.toFixed(2);$('calBack').value=cl.back*100;$('calBackOut').value=cl.back.toFixed(2);$('showPts').checked=st.showPts;
  $('stSel').textContent=st.scope==='all'?'· 十指同色':'· '+FNAMES[st.finger];
}
buildStatic();

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const p=b.parentElement.id,pp=b.parentElement.parentElement;
  if(p==='fingerSel'){if(b.dataset.i==='all')st.scope='all';else{st.scope='one';st.finger=+b.dataset.i}}
  else if(b.getAttribute('role')==='tab'){b.parentElement.querySelectorAll('[role=tab]').forEach(t=>t.setAttribute('aria-selected',String(t===b)));document.querySelectorAll('.pane').forEach(pn=>pn.classList.toggle('on',pn.id==='pane-'+b.dataset.t));$('sheet').classList.remove('min');return}

  const alpha=p.finish==='jelly'?Math.min(st.opacity,.72):st.opacity;
  // feathered edge: paint through a slightly blurred clip by drawing to an offscreen layer
  const pad=Math.ceil(Math.max(n.w,n.l)*1.4),ox=n.cx-pad,oy=n.cy-pad,sz=pad*2;
  const off=paintNail.off||(paintNail.off=document.createElement('canvas'));off.width=sz;off.height=sz;const o=off.getContext('2d');
  o.save();o.translate(n.cx-ox,n.cy-oy);o.rotate(n.ang);o.scale(n.w,n.l);unitPath(o,st.shape);o.clip();
  o.fillStyle=hexA(p.color,alpha);o.fillRect(-.6,-.2,1.2,1.4);
  patternLayer(o,p,seed);
  // keep the photo's own lighting
  o.save();o.setTransform(1,0,0,1,0,0);o.globalCompositeOperation='soft-light';o.globalAlpha=.2;o.drawImage(src,-ox,-oy,ctx.canvas.width,ctx.canvas.height);o.restore();
  finishLayer(o,p,seed);
  decorLayer(o,p);
  o.restore();
  // edge line
  o.save();o.translate(n.cx-ox,n.cy-oy);o.rotate(n.ang);o.scale(n.w,n.l);unitPath(o,st.shape);o.restore();
  o.strokeStyle='rgba(40,10,25,.35)';o.lineWidth=Math.max(1,n.w*.03);o.stroke();
  ctx.save();ctx.filter=`blur(${Math.max(.4,n.w*.012)}px)`;ctx.drawImage(off,ox,oy);ctx.restore();
  if(selected){ctx.save();ctx.translate(n.cx,n.cy);ctx.rotate(n.ang);ctx.scale(n.w,n.l);unitPath(ctx,st.shape);ctx.restore();ctx.setLineDash([6,4]);ctx.strokeStyle='#FFFFFF';ctx.lineWidth=Math.max(1.5,n.w*.05);ctx.stroke();ctx.setLineDash([])}
}
function drawPatThumbs(){
  const p=cur();
  $('patGrid').querySelectorAll('.pat').forEach(b=>{const c=b.querySelector('canvas'),x=c.getContext('2d');x.clearRect(0,0,68,92);
    x.save();x.translate(34,10);x.scale(56,74);unitPath(x,st.shape);x.clip();x.fillStyle=p.color;x.fillRect(-.6,-.2,1.2,1.4);patternLayer(x,{...p,pattern:b.dataset.k},3);x.restore()});
}
/* ---------- pipeline ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');
let hands=null,photo=null,lastHands=[],frames=[],selHand=0;
const setStatus=(t,warn)=>{$('stHands').textContent=t;$('stHands').classList.toggle('warn',!!warn)};
const overlay=(title,text,spin)=>{$('overlay').hidden=!title;if(title){$('ovTitle').textContent=title;$('ovText').textContent=text||'';$('spin').hidden=!spin}};

async function loadHands(){
  let base='mp/',local=true;
  try{const r=await fetch(base+'hands.binarypb.wasm',{method:'HEAD'});if(!r.ok)throw 0}catch(e){base='https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/';local=false}
  const name=f=>local&&!/\.(js|wasm)$/.test(f)?f+'.wasm':f;
  await new Promise((res,rej)=>{const s=document.createElement('script');s.src=base+'hands.js';s.onload=res;s.onerror=()=>rej(new Error('脚本加载失败'));document.head.appendChild(s)});
  const h=new Hands({locateFile:f=>base+name(f)});
  h.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.5,minTrackingConfidence:.5,staticImageMode:true,selfieMode:false});
  h.onResults(onResults);
  await h.initialize();return h;
}
function onResults(r){
  lastHands=r.multiHandLandmarks||[];adj={};selHand=0;computeBase();
  setStatus(lastHands.length?`识别到 ${lastHands.length} 只手`:'没识别到手：换一张手背朝镜头、指甲清楚的照片',!lastHands.length);draw();
}
function draw(){
  if(!photo)return;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  ctx.drawImage(photo,0,0,cv.width,cv.height);
  frames=[];
  lastHands.forEach((lm,k)=>nailFrames(lm,cv.width,cv.height,k).forEach(n=>{frames.push(n);paintNail(ctx,photo,n,st.scope==='one'&&k===selHand&&n.f===st.finger)}));
  if(st.showPts){const W=cv.width,H=cv.height,r=Math.max(3,W/220);lastHands.forEach(lm=>{
    for(let f=0;f<5;f++){const s=seedFrame(lm,W,H,f);ctx.strokeStyle='#2BB5FF';ctx.lineWidth=r*.7;ctx.beginPath();ctx.moveTo(s.dip.x,s.dip.y);ctx.lineTo(s.tip.x+s.ux*s.seg*.5,s.tip.y+s.uy*s.seg*.5);ctx.stroke()}
    lm.forEach((p,i)=>{ctx.fillStyle=TIP.includes(i)?'#3BFF6A':'#FFE24A';ctx.beginPath();ctx.arc(p.x*W,p.y*H,r,0,Math.PI*2);ctx.fill()})})}
}
function loadImage(file){
  return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(url);res(im)};im.onerror=()=>rej(new Error('图片打不开'));im.src=url});
}
$('file').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  overlay('正在识别指甲','',true);
  try{
    const im=await loadImage(f);
    const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    photo=c;cv.width=c.width;cv.height=c.height;
    if(!hands)hands=await loadHands();
    await hands.send({image:photo});
    overlay(null);$('snapBtn').disabled=false;$('resetBtn').disabled=false;syncUI();
  }catch(err){overlay('这张图没能处理',String(err.message||err),false)}
  e.target.value='';
});

/* drag to move a nail; tap to select it */
let drag=null;
const toCanvas=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
cv.addEventListener('pointerdown',e=>{
  if(!frames.length)return;const p=toCanvas(e);
  let best=null,bd=1e9;frames.forEach(n=>{const cx=n.cx+Math.cos(n.ang+Math.PI/2)*n.l*.5,cy=n.cy+Math.sin(n.ang+Math.PI/2)*n.l*.5;const d=Math.hypot(p.x-cx,p.y-cy);if(d<bd){bd=d;best=n}});
  if(!best||bd>best.w*1.3)return;
  st.scope='one';st.finger=best.f;selHand=best.k;const a=adjOf(best.k,best.f);
  drag={a,x:p.x,y:p.y,dx:a.dx,dy:a.dy};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';save();syncUI();draw();
});
cv.addEventListener('pointermove',e=>{if(!drag)return;const p=toCanvas(e);drag.a.dx=drag.dx+p.x-drag.x;drag.a.dy=drag.dy+p.y-drag.y;draw()});
const endDrag=()=>{drag=null;cv.style.cursor='grab'};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
$('resetBtn').addEventListener('click',()=>{adj={};syncUI();draw()});

function sheetText(){
  const L=(list,k)=>(list.find(x=>x[0]===k)||[k,k])[1];
  const d=new Date(),date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const desc=p=>{let t=`底色 ${codeOf(p.color)} ${p.color} · ${L(FINISHES,p.finish)}`;if(p.pattern!=='none')t+=` · ${L(PATTERNS,p.pattern)}（${codeOf(p.pc)} ${p.pc}）`;if(p.decor!=='none')t+=` · ${L(DECORS,p.decor)}`;return t};
  const m=new Map();st.per.forEach((p,i)=>{const k=desc(p);m.set(k,[...(m.get(k)||[]),FNAMES[i]])});
  let out=`美甲设计单 ${date}\n甲型：${L(SHAPES,st.shape)}，长度：${L(LENGTHS,st.len)}\n`;
  for(const [k,v] of m)out+=`${v.length===5?'十指':v.join('、')}：${k}\n`;
  return out.trim();
}
$('copyBtn').addEventListener('click',()=>{const t=$('sheetText'),b=$('copyBtn');const done=m=>{b.textContent=m;setTimeout(()=>b.textContent='复制设计单',1800)};
  try{navigator.clipboard.writeText(t.value).then(()=>done('已复制'),()=>{t.select();done('已选中，手动复制')})}catch(e){t.select();done('已选中，手动复制')}});
$('snapBtn').addEventListener('click',()=>{
  const was=st.scope;st.scope='all';draw();st.scope=was;   // no selection outline in the export
  $('shotImg').src=cv.toDataURL('image/jpeg',.92);$('sheetText').value=sheetText();$('shot').hidden=false;draw();
});

syncUI();
(async()=>{try{hands=await loadHands();overlay('准备好了','点“拍照 / 选图”，拍一张手背。',false)}catch(e){overlay('识别模型没加载出来','检查网络后刷新再试。'+(e.message||''),false)}})();
</script>
